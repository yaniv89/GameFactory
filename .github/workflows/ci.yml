name: CI

# CLAUDE.md Section 4.9 / docs/SPEC.md Section 10.4: every gate here runs on
# every PR and blocks merge. M0's exit criterion is that a deliberately
# introduced XSS, eval, hardcoded secret, CSP wildcard, or bundle-size
# regression each independently fails one of these jobs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JS/TS: typecheck, test, build, Storybook ──────────────────────────
  js-build-test:
    name: JS/TS — typecheck, test, build, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: @forge/module-api ships compiled dist/*.d.ts (its
      # package.json "types" field points there, not at src/), so every
      # consumer's typecheck/test step needs that dist/ to already exist —
      # running typecheck before build fails with "Cannot find module
      # '@forge/module-api'" on every first-party module and runtime-host.
      # pnpm's recursive execution is topologically ordered by default, so
      # a single `pnpm -r run build` already builds module-api before its
      # dependents build.
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - name: Build Storybook (design-system)
        run: pnpm --filter @forge/ds run build-storybook
      - name: Build Storybook (editor)
        run: pnpm --filter forge-editor run build-storybook

  # ── Gate: pnpm dependency vulnerability scan ──────────────────────────
  js-audit:
    name: Security gate — pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # ── Gate: license compliance (CLAUDE.md 4.9 #10) ──────────────────────
  license-check:
    name: Security gate — license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/security/license-check.mjs

  # ── Gate: module-api / first-party-module boundary (CLAUDE.md 3.1/3.2) ─
  module-boundaries:
    name: Structure gate — module-api and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node tools/security/check-module-boundaries.mjs

  # ── Gate: CSP linter — no wildcard/unsafe-eval/unsafe-inline (4.9 #9) ─
  csp-lint:
    name: Security gate — CSP linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node tools/security/csp-lint.mjs

  # ── Gate: performance budgets (CLAUDE.md Section 7) ───────────────────
  bundle-size:
    name: Performance gate — bundle size budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/bench/check-bundle-size.mjs

  # ── Gate: Module API surface — api-extractor (CLAUDE.md Section 3.1) ──
  # "CI runs api-extractor and fails on any change to the public surface
  # that is not accompanied by an updated .api.md report file, so no API
  # change can happen accidentally." A drift check, not a style check —
  # verified to actually fail on a real signature change before this was
  # trusted (see the M3 Phase 2 commit history), not just assumed to work.
  module-api-surface:
    name: Structure gate — Module API surface (api-extractor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forge/module-api run api-check

  # ── Gate: @forge/render-2d real-browser tests (M1 Phase 3/5) ───────────
  # Verifies real Pixi behavior (WebGPU/WebGL2 boot, actual rendered pixel
  # output, render-throughput/heap sanity) in headless Chromium — this
  # sandbox's pre-installed browser doesn't exist on a GH runner, so CI
  # installs its own via `playwright install` rather than relying on the
  # sandbox-path fallback in playwright.config.ts (see that file's doc
  # comment). Correctness assertions here block merge same as any other
  # test; the frame-time/heap numbers it also prints are informational —
  # see runtime-benchmark below for why those aren't a hard gate yet.
  render-2d-browser-tests:
    name: JS/TS — @forge/render-2d real-browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forge/render-2d exec playwright install --with-deps chromium
      - run: pnpm --filter @forge/render-2d run test:browser

  # ── Gate: real-browser SceneCanvas rendering (M4 Phase 2) ─────────────
  editor-browser-tests:
    name: JS/TS — forge-editor real-browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # forge-editor's dev server (which these Playwright tests drive)
      # resolves its workspace dependencies (@forge/ds, @forge/module-api,
      # @forge/render-2d, @forge/dialogue, @forge/core) against their
      # compiled dist/ output, same as the js-build-test job's own
      # build-before-typecheck fix — `^...` builds forge-editor's
      # dependencies without also running editor's own tsc/vite build,
      # which this job doesn't need (Vite serves editor's source directly
      # in dev mode).
      - run: pnpm --filter "forge-editor^..." run build
      - run: pnpm --filter forge-editor exec playwright install --with-deps chromium
      - run: pnpm --filter forge-editor run test:browser

  # ── Gate: M6 exit criterion — forge export to a real file:// build ────
  # test-browser/exportedGame.spec.ts runs the real `forge export` CLI
  # (packages/cli's compiled dist/index.js, a real subprocess, not an
  # in-process shortcut) against the checked-in
  # fixtures/projects/starter-rpg/project.json, opens the output
  # index.html from a genuine file:// URL, and plays it — proving both
  # halves of "exported to file:// with no network access" (CLAUDE.md
  # Milestone M6 exit criterion) mechanically, not by inspection.
  # "{packages/cli}..." (not "forge...") sidesteps a real name collision
  # in this repo: root package.json and packages/cli/package.json are
  # both named "forge", so a bare `--filter forge` resolves to the root
  # workspace script instead of the CLI package — the path-scoped
  # selector is unambiguous.
  player-browser-tests:
    name: JS/TS — @forge/player real-browser (Playwright) — M6 exit criterion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "{packages/cli}..." run build
      - run: pnpm --filter @forge/player exec playwright install --with-deps chromium
      - run: pnpm --filter @forge/player run test:browser

  # ── Informational: runtime simulation benchmark (M1 Phase 5) ──────────
  # Runs @forge/core's headless ECS+collision throughput bench and
  # steady-state heap check (part of its normal `test` script, already
  # covered by js-build-test) and prints the numbers. Deliberately NOT a
  # pass/fail gate against docs/SPEC.md Section 18.1's ms budgets: those
  # budgets are defined against Section 18.3's reference device matrix
  # (Moto G Power 2021, Pixel 6a, 2019 MacBook Air, Ryzen 5/GTX 1660),
  # and GitHub Actions' shared runners are none of those — gating on them
  # here would be comparing incomparable hardware and could pass or fail
  # for reasons that have nothing to do with the code. See
  # tools/bench/README.md. This job exists so the numbers are visible in
  # every PR (regression-by-eyeball) until a real device farm exists to
  # gate on for real.
  runtime-benchmark:
    name: Performance (informational) — runtime simulation benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @forge/core run bench

  # ── Gate: Semgrep (custom rules + OWASP Top 10 pack) ──────────────────
  semgrep:
    name: Security gate — Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config tools/security/rules --config p/owasp-top-ten --error

  # ── Gate: secret scanning (gitleaks) on full PR history ───────────────
  gitleaks:
    name: Security gate — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --log-opts="--all" --redact --verbose

  # ── Gate: CodeQL (TypeScript/JavaScript and C#) ───────────────────────
  codeql:
    name: Security gate — CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, csharp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - if: matrix.language == 'csharp'
        run: dotnet build Forge.sln
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── .NET: restore, build, vulnerable-package scan, test ───────────────
  dotnet-build-test:
    name: .NET — build, vulnerable-package scan, test (incl. security headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      # docs/SPEC.md Section 10.4 gate 4 (M6 Phase 3): SmokeRunGateTests
      # and ScanOrchestratorTests spawn the real, built
      # packages/runtime-host smoke-run CLI as a subprocess — not a fake
      # standing in for the cross-language boundary that gate actually
      # has. Same story for docs/adr/0010's BuildRunnerTests/
      # BuildOrchestratorTests (Forge.Functions.Build, C3): they spawn the
      # real, compiled `forge` CLI (packages/cli) as a subprocess too, so
      # its closure is built here as well — the "forge..." filter is a
      # package name, not a directory (packages/cli/package.json's
      # "name" field is literally "forge", not "@forge/cli"). Only these
      # two packages and their own dependency closures are built
      # here (pnpm's `...` "package plus dependencies" selector, same
      # reasoning as tools/bench/check-bundle-size.mjs's own use of it) —
      # this job has no need for the editor, Storybook, or any other JS
      # workspace member the js-build-test job already covers.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@forge/runtime-host..." --filter "forge..." run build
      - run: dotnet restore Forge.sln
      - run: dotnet build Forge.sln --no-restore --configuration Release

      - name: Security gate — vulnerable NuGet packages
        run: |
          dotnet list Forge.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.log
          if grep -qi "has the following vulnerable packages" vulnerable-packages.log; then
            echo "::error::Vulnerable NuGet package(s) found. See CLAUDE.md Section 4.9 gate #1."
            exit 1
          fi

      - name: Test (includes services/Forge.Tests/Security/HeaderTests.cs and Authorization/CrossTenantAuthorizationTests.cs)
        run: dotnet test Forge.sln --no-build --configuration Release --filter "Category!=Load"

  # ── Load test gate: docs/SPEC.md Section 18.4, M5 exit criterion ──────
  # A separate job (not a step in dotnet-build-test above) specifically so
  # this gate's run time — real concurrent HTTP load against a real
  # Testcontainers Postgres/Redis pair — never slows down the fast
  # unit-test feedback loop every other PR waits on. Runs
  # services/Forge.Tests/LoadTests/ConcurrentEditorsLoadTests.cs, tagged
  # Category=Load and excluded from the job above for exactly this reason.
  #
  # Formerly a tripwire job here ("Deferred gates (cross-tenant auth M5)")
  # that deliberately failed the moment a *CrossTenant* test file showed
  # up, so the gate could never be silently forgotten. That file now
  # exists (services/Forge.Tests/Authorization/CrossTenantAuthorizationTests.cs)
  # and runs for real in dotnet-build-test above — nothing left to defer
  # there. This job is the other M5 Section 8 exit-criterion piece
  # ("load test sustains 200 concurrent editors with zero lost writes")
  # that tripwire was also standing in for.
  #
  # M7 Phase 8 also runs its own soak proof here (same Category=Load tag):
  # services/Forge.Tests/LoadTests/M7ExitCriteriaTests.cs's collaboration
  # half ("two people co-edit the same tilemap layer for 30 minutes with
  # no lost work") — a real, extended-duration SignalR/Yjs relay soak, not
  # a quick smoke test, so it belongs in this job for the same run-time
  # reason as the M5 load test. That file's marketplace half (publish,
  # buy, install, get paid) isn't Load-tagged — it's a deep real-service
  # integration test, not a high-volume one, the same category
  # ScanOrchestratorTests.cs already runs in the fast job above.
  load-test-gate:
    name: Load test gate — M5/M7 exit criteria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Forge.sln
      - run: dotnet build Forge.sln --no-restore --configuration Release
      - name: Load test — concurrent editors, zero lost writes (docs/SPEC.md Section 18.4)
        run: dotnet test Forge.sln --no-build --configuration Release --filter "Category=Load"

  # ── Gate: full-stack E2E — real Postgres/Redis/Azurite + Forge.Api + the
  # editor, driven through a real browser ──────────────────────────────
  # This is the automated form of an actual manual run that found two real
  # bugs neither the rest of this file nor test-browser/ could ever have
  # caught: AuthCallback.tsx double-exchanging its one-time OAuth code
  # under React 18 StrictMode, and vite.config.ts's dev proxy missing
  # changeOrigin (broke every collab connection, silently, since nothing
  # else here exercises /hubs/collab/negotiate). test-browser/'s own
  # fixtures.ts deliberately bypasses auth and runs with no backend at
  # all — real by design, for a different reason (canvas/rendering, not
  # auth/API wiring). test-fullstack/signupToSave.spec.ts is that same
  # manual signup-through-save run, scripted, so the next bug like these
  # two is caught here instead of by a human.
  #
  # Postgres/Redis/Azurite as GitHub Actions `services:` (this repo's own
  # authoring sandbox reached the same endpoint by a different road — no
  # Docker Hub access there, so apt/npm installs stood in for these same
  # three pieces of infra; GitHub-hosted runners have full Docker access,
  # so the images docker-compose.yml already names are the natural choice
  # here, not a divergent setup).
  full-stack-e2e:
    name: Full stack E2E — signup, save, presence (real Postgres/Redis/Azurite + Forge.Api)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forge_dev
          POSTGRES_USER: forge_dev
          POSTGRES_PASSWORD: forge_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge_dev -d forge_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
      # Forge.Api runs in Development below (schema bootstrap + OpenIddict
      # seeding, see that step's own comment) — appsettings.Development.json
      # unconditionally points Forge.Infrastructure.Email.SmtpEmailSender
      # at localhost:1025 whenever that environment name is set, same as
      # local dev (docker-compose.yml). Without this service, real
      # signup's synchronous verification-email send throws (connection
      # refused), which was silently taking the whole signup request down
      # with it — this container is what makes CI mirror local dev
      # exactly rather than needing an ad hoc "don't send mail" override.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same reasoning as editor-browser-tests above: the editor's dev
      # server resolves its workspace dependencies against their compiled
      # dist/ output. The second filter is a separate concern: docs/adr/0009's
      # exportProjectDocument.spec.ts spawns the real `forge` CLI
      # (packages/cli) as a subprocess of its compiled dist/index.js — that's
      # not an import edge, so it's invisible to "forge-editor^..." and needs
      # its own closure built explicitly, or the spec fails in CI with
      # "Cannot find module" despite passing locally (where a full `pnpm -r
      # run build` had already been run by hand).
      - run: pnpm --filter "forge-editor^..." --filter "forge..." run build
      - run: dotnet restore Forge.sln
      - run: dotnet build services/Forge.Api/Forge.Api.csproj --no-restore --configuration Release

      - name: Start Forge.Api (Development — schema bootstrap + OpenIddict dev cert/seeding, see Program.cs)
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project services/Forge.Api --no-build --configuration Release --urls http://localhost:5080 > forge-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Forge.Api did not become healthy in time"
          cat forge-api.log
          exit 1

      - name: Start editor dev server
        working-directory: packages/editor
        run: |
          pnpm exec vite --port 5190 --strictPort > editor.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5190/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Editor dev server did not become healthy in time"
          cat editor.log
          exit 1

      - run: pnpm --filter forge-editor exec playwright install --with-deps chromium
      - run: pnpm --filter forge-editor run test:fullstack

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-stack-e2e-logs
          path: |
            forge-api.log
            packages/editor/editor.log
          if-no-files-found: ignore
          retention-days: 5
