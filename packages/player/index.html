<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge game</title>
    <style>
      html, body { margin: 0; height: 100%; background: #232a26; font-family: system-ui, sans-serif; }
      #forge-player-root { position: fixed; inset: 0; }
      #forge-player-canvas { display: block; width: 100%; height: 100%; }
      /*
        Plain, self-contained CSS, not @forge/ds tokens — CLAUDE.md 5.2's
        token system governs *editor chrome*; this is the game itself, the
        same "separate visual language" tilePalette.ts's own doc comment
        already treats tile/entity colors as (5.7: the scene canvas
        doesn't mirror RTL either, for the same reason — game content vs.
        editor UI are different things). @forge/ds is not a dependency of
        this package.
      */
      #forge-player-dialogue {
        position: fixed;
        inset-inline: 16px;
        inset-block-end: 16px;
        display: none;
        flex-direction: column;
        gap: 4px;
        padding: 12px 16px;
        background: rgb(20 24 22 / 0.92);
        border: 1px solid rgb(255 255 255 / 0.15);
        border-radius: 8px;
        color: #e8e8e8;
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.4);
      }
      #forge-player-dialogue[data-open="true"] { display: flex; }
      #forge-player-dialogue-speaker { font-weight: 700; font-size: 14px; }
      #forge-player-dialogue-text { font-size: 14px; color: #c8c8c8; }
    </style>
  </head>
  <body>
    <div id="forge-player-root">
      <canvas id="forge-player-canvas"></canvas>
      <div id="forge-player-dialogue" role="status">
        <span id="forge-player-dialogue-speaker"></span>
        <span id="forge-player-dialogue-text"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
