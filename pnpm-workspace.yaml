packages:
  - "packages/*"
  - "packages/modules/*"

# TODO(#2): CVE-2026-53571 (GHSA-fx2h-pf6j-xcff) affects every Vite 5.x
# release and is only patched in Vite >=6.4.3, one major above the Vite 5
# pin in CLAUDE.md Section 2.2. Scoped suppression, not a blanket ignore —
# remove this entry once #2 is resolved.
auditConfig:
  ignoreCves:
    - CVE-2026-53571

# Supply-chain hardening (Semgrep pnpm-workspace rules, run by the semgrep
# CI gate — CLAUDE.md Section 4.9):
#   - blockExoticSubdeps: reject transitive deps installed from untrusted
#     sources (git/tarball URLs) rather than a registry.
#   - minimumReleaseAge: wait 7 days before a newly published version is
#     eligible for install, so a compromised release has time to be caught
#     and yanked before it reaches this repo.
#   - trustPolicy: reject a dependency update that silently downgrades
#     these settings.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade

# TODO(#6): pnpm 10.33's per-package trust-downgrade check
# (ERR_PNPM_TRUST_DOWNGRADE, a separate signal from trustPolicy above,
# which governs *this file's own settings*, not individual packages'
# npm-registry publish metadata) flags vite@5.4.21 — "earlier versions
# had trusted publisher, but this version has provenance attestation."
# Investigated, not assumed: this is the exact same vite@5.4.21 already
# pinned by CLAUDE.md Section 2.2 and already resolved/running throughout
# this entire repo's own build (packages/editor's dev server and
# production build) since M0 — a live compromise of this specific,
# already-vendored version would already be exercised continuously here,
# not newly introduced by excluding it from a second, freshly-added
# dependency edge (packages/player's own Vite build, M6 Phase 5e). Scoped
# to this exact version, same "documented, tracked, not a blanket ignore"
# shape as CVE-2026-53571 above — remove once #6 is resolved (either the
# registry's trust signal is re-confirmed, or Vite ships a release that
# restores it).
trustPolicyExclude:
  - "vite@5.4.21"
