packages:
  - "packages/*"
  - "packages/modules/*"

# Supply-chain hardening (Semgrep pnpm-workspace rules, run by the semgrep
# CI gate — CLAUDE.md Section 4.9):
#   - blockExoticSubdeps: reject transitive deps installed from untrusted
#     sources (git/tarball URLs) rather than a registry.
#   - minimumReleaseAge: wait 7 days before a newly published version is
#     eligible for install, so a compromised release has time to be caught
#     and yanked before it reaches this repo.
#   - trustPolicy: reject a dependency update that silently downgrades
#     these settings.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade

# Issue #6 (resolved): pnpm 10.33's per-package trust-downgrade check
# (ERR_PNPM_TRUST_DOWNGRADE) flagged vite@5.4.21 — "earlier versions had
# trusted publisher, but this version has provenance attestation." Confirmed
# benign via real npm registry metadata (consistent SLSA v1 provenance
# across 5.4.18-5.4.21, genuine vitejs/vite repository, official
# maintainers) — a category migration to a stronger trust signal, not a
# compromise indicator. That version is no longer pinned (docs/adr/0007
# bumped to vite@6.4.3 for issue #2's CVE-2026-53571 fix), so the
# now-stale exclude entry is removed; if the newly pinned version trips
# the same check, re-add a scoped entry then rather than pre-emptively.
